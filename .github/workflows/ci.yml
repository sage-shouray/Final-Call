name: CI

# Path-filtered so a backend change does not run the frontend jobs and vice
# versa. Both jobs are green on the current tree — the linters are deliberately
# advisory for now (see the ratchet note below) rather than blocking work on a
# backlog of pre-existing findings.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docparser/apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docparser_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        # 7.x, not the 3.2 some dev machines run: stream commands (XADD) do not
        # exist before Redis 5, so an older server would pass code that breaks.
        image: redis:7.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/docparser_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-value-not-used-anywhere-else
      # Deliberately unset: no test may reach SAP. SERV_PO_VAL posts a MIRO and
      # MIGO posts stock movement, so a leaked call would create real documents.
      SAP_BASE_URL: http://127.0.0.1:1
      GEMINI_API_KEY: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: docparser/apps/api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Import check
        # Catches the class of failure where a module is imported at runtime but
        # missing from the manifest — the app installs, then dies on boot.
        run: python -c "import src.main, src.workers.pipeline_worker, src.workers.process_worker"

      - name: Manifest parity
        # requirements.txt is what Docker installs; pyproject is what pip installs.
        # They drifted before, shipping an image without pypdf that crashed on start.
        run: |
          python - <<'PY'
          import re, tomllib
          norm = lambda s: re.split(r'[><=\[]', s.strip())[0].strip().lower()
          req = {norm(l) for l in open('requirements.txt') if l.strip() and not l.startswith('#')}
          proj = {norm(x) for x in tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']}
          if req != proj:
              raise SystemExit(f"manifests disagree:\n  requirements-only: {sorted(req-proj)}\n  pyproject-only: {sorted(proj-req)}")
          print("manifests agree")
          PY

      - name: Tests
        run: pytest -q

      - name: Lint (advisory)
        # Ratchet: make the count visible on every PR without blocking merges.
        # Drive it down, then flip this to a required check.
        continue-on-error: true
        run: ruff check src/

  # ───────────────────────────────────────────────────────────────────────────
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docparser/apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docparser/package-lock.json

      - name: Install
        run: npm ci
        working-directory: docparser

      - name: Type check
        run: npm run type-check

      - name: Tests
        run: npm run test

      - name: Build
        # The gate that matters: `tsc && vite build` failed on unused imports for
        # an unknown period, meaning no production bundle could be produced.
        run: npm run build

      - name: Lint (advisory)
        continue-on-error: true
        run: npm run lint
