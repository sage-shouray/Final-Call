# SonarQube configuration
#
# Run from this directory (docparser/) after generating coverage:
#   cd apps/api && pytest -q            -> coverage.xml, test-results.xml
#   cd apps/web && npm run test:coverage -> coverage/lcov.info
#   sonar-scanner
#
# The server is self-hosted rather than SonarCloud deliberately: this repository
# is private and its history carries customer invoices, so the free public-repo
# tier is not an option.

sonar.projectKey=uvira-docparser
sonar.projectName=UVIRA DocParser
sonar.projectVersion=0.1.0

sonar.sources=apps/api/src,apps/web/src
sonar.tests=apps/api/tests,apps/web/src

# Test files live beside the components they cover on the frontend, so they are
# identified by name rather than by directory.
sonar.test.inclusions=apps/api/tests/**/*.py,apps/web/src/**/*.test.ts,apps/web/src/**/*.test.tsx

sonar.exclusions=\
  apps/api/src/uploads/**,\
  apps/web/dist/**,\
  apps/web/node_modules/**,\
  **/__pycache__/**,\
  **/*.min.js,\
  packages/**/dist/**

# Uploaded customer invoices are data, not source. They are also the reason this
# analysis stays on a self-hosted server.
sonar.coverage.exclusions=\
  apps/api/src/main.py,\
  apps/api/alembic/**,\
  apps/api/scripts/**,\
  apps/web/src/test/**

sonar.python.version=3.11
sonar.python.coverage.reportPaths=apps/api/coverage.xml
sonar.python.xunit.reportPath=apps/api/test-results.xml

sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
sonar.typescript.tsconfigPath=apps/web/tsconfig.json

sonar.sourceEncoding=UTF-8
