services:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-docparser}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 127.0.0.1 only — nothing outside this server needs to reach
      # Postgres directly; the api/worker containers reach it over the
      # internal docparser_net network regardless of this binding.
      - "127.0.0.1:5432:5432"
    networks:
      - docparser_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-docparser}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    ports:
      # Same reasoning as postgres above.
      - "127.0.0.1:6379:6379"
    networks:
      - docparser_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # 127.0.0.1 only — the internal nginx reaches this container over
      # docparser_net by service name, not through this published port.
      # Kept bound to loopback (rather than removed) so `curl 127.0.0.1:8000`
      # still works for debugging directly on the server.
      - "127.0.0.1:8000:8000"
    volumes:
      # Bind-mounted, not a Docker-managed volume: uploaded invoice PDFs are
      # customer data, and a plain host folder is something that can be found,
      # backed up, and inspected directly, rather than needing `docker volume`
      # commands. Without this, storage_service.py's local-disk fallback wrote
      # into the container's own filesystem, and a container replacement (a
      # redeploy, an image update, `docker compose up --force-recreate`) lost
      # every stored invoice with no warning.
      - ../../data/uploads:/app/uploads
    networks:
      - docparser_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # There is deliberately no Celery worker service here. Nothing in this
  # application enqueues a task through Celery — every background job (the
  # pipeline, mail polling, the event consumer) runs as an asyncio task inside
  # the api container's own process, started from src/main.py's lifespan.
  # celery_app.py exists in the source tree but is never invoked. A worker
  # service was defined here once; it crash-looped every ~30s trying to reach
  # Redis at "localhost" (config.py's untouched CELERY_BROKER_URL default,
  # meaningless inside a container) for a queue nothing was ever feeding.

  # ---------------------------------------------------------------------------
  # React / Vite (production build served by nginx)
  # ---------------------------------------------------------------------------
  web:
    build:
      # The whole workspace root, not ../apps/web alone — apps/web/Dockerfile
      # needs the shared package-lock.json one level above it. See that
      # Dockerfile's own comment for why.
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - docparser_net

  # ---------------------------------------------------------------------------
  # Nginx (reverse proxy + static files)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    # Bound to 127.0.0.1, not 0.0.0.0 — never reachable from the internet
    # directly. The host's own nginx (installed via apt, outside Docker) is
    # the single public door on 80/443 for every product on this server; it
    # reverse-proxies ap.uvira.ai to this port. TLS terminates at that outer
    # layer too, which is why this inner nginx only serves plain HTTP.
    ports:
      - "127.0.0.1:8001:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks:
      - docparser_net

networks:
  docparser_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
